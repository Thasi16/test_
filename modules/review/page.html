<section class="review-page" aria-labelledby="review-page-title" data-sample-slugs="{{review.sample_slugs}}">
  <div class="sh-page-head review-page-head">
    <h1 id="review-page-title">{{review.title}}</h1>
  </div>
  <section class="review-launch" aria-labelledby="review-launch-title" data-lesson-id="video">
    <div class="review-launch-copy">
      <h2 id="review-launch-title">{{review.video_quiz.title}}</h2>
      <div class="review-launch-meta" aria-label="{{review.video_quiz.details}}">
        <span><strong>{{review.video_count}}</strong>{{review.video_quiz.videos}}</span>
        <span><strong>4</strong>{{review.video_quiz.choices}}</span>
      </div>
      <p class="review-best" data-best hidden></p>
      <a class="button review-launch-button" href="{{review.video_quiz_url}}">{{review.video_quiz.start}} <span aria-hidden="true">→</span></a>
    </div>
    <div class="review-launch-visual" aria-hidden="true">
      <div class="review-launch-orbit review-launch-orbit-one"></div>
      <div class="review-launch-orbit review-launch-orbit-two"></div>
      <div class="review-launch-play"><span>▶</span></div>
      <span class="review-choice-bubble review-choice-a">A</span>
      <span class="review-choice-bubble review-choice-b">B</span>
      <span class="review-choice-bubble review-choice-c">C</span>
      <span class="review-choice-bubble review-choice-d">D</span>
    </div>
  </section>
</section>
