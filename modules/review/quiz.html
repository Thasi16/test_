<section class="review-quiz" aria-labelledby="review-quiz-title" data-lesson-id="{{review.lesson_id}}" data-quiz-mode="{{review.quiz_mode}}" data-sample-slugs="{{review.sample_slugs}}">
  <div class="review-quiz-head">
    <a class="review-back-link" href="{{review.back_url}}" aria-label="{{review.go.review}}">←</a>
    <h1 id="review-quiz-title">{{review.heading}}</h1>
  </div>
  <noscript>
    <div class="sh-card review-no-js"><p>{{review.quiz.no_js}}</p><h2>{{review.reading.title}}</h2><ul class="review-reading">{{review.reading.html}}</ul></div>
  </noscript>
  <div data-quiz-app hidden>
    <section class="review-question-card" data-question-card aria-labelledby="review-question-title">
      <div class="review-question-progress">
        <span class="review-position-pill" data-question-position></span>
        <div class="sh-progress" aria-hidden="true"><span data-quiz-bar></span></div>
      </div>
      <div class="review-question-layout">
        <div class="review-media-panel">
          <div class="review-question-media" data-question-media hidden></div>
          <span class="review-media-glow review-media-glow-one" aria-hidden="true"></span>
          <span class="review-media-glow review-media-glow-two" aria-hidden="true"></span>
        </div>
        <div class="review-answer-panel">
          <span class="sh-badge sh-badge--sample" data-question-sample hidden>{{shell.badge.sample}}</span>
          <h2 id="review-question-title" tabindex="-1" data-question></h2>
          <div class="review-options" data-options role="group" aria-labelledby="review-question-title"></div>
          <p class="review-quiz-feedback" data-feedback role="status" aria-live="assertive" aria-atomic="true"></p>
          <div class="review-question-actions">
            <button class="button" type="button" data-next-question disabled>{{review.quiz.next}}</button>
          </div>
        </div>
      </div>
    </section>
    <section class="sh-card review-result" data-result hidden aria-labelledby="review-result-title">
      <h2 id="review-result-title" data-result-title tabindex="-1">{{review.result.title}}</h2>
      <div class="review-score-line"><span class="review-score-stars" aria-hidden="true">✦</span><p class="review-result-score" data-result-score></p><span class="review-score-medal" aria-hidden="true">🏅</span></div>
      <p class="review-result-message" data-result-message role="status" aria-live="polite"></p>
      <div class="review-result-content">
        <div class="review-result-art" aria-hidden="true">
          <span class="review-art-sparkle review-art-sparkle-one">✦</span><span class="review-art-sparkle review-art-sparkle-two">✦</span><span class="review-art-sparkle review-art-sparkle-three">✦</span>
          <span class="review-balloon review-balloon-blue"></span><span class="review-balloon review-balloon-pink"></span>
          <img class="review-result-mascot" src="/static/assets/mascot.png" width="1351" height="1164" alt="">
        </div>
        <div class="review-mistakes" data-mistakes hidden><h3>{{review.result.mistakes}}</h3><ul data-mistake-list></ul></div>
      </div>
      <div class="review-result-actions">
        <button class="button review-retry" type="button" data-retry><span aria-hidden="true">↻</span>{{review.quiz.retry}}</button>
        {{review.lesson_action.html}}
      </div>
    </section>
  </div>
</section>
